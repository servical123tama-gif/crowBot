<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Capster — CrowBarbershop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 60%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 32px 80px rgba(0,0,0,.35);
    }
    .brand-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0f3460, #e94560);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 1rem;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: .9rem;
      padding: .6rem .85rem;
    }
    .form-control:focus {
      border-color: #0f3460;
      box-shadow: 0 0 0 3px rgba(15,52,96,.12);
    }
    .btn-login {
      background: linear-gradient(135deg, #0f3460, #e94560);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      padding: .65rem;
      font-size: .9rem;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }
    .owner-link {
      font-size: .78rem;
      color: #94a3b8;
      text-decoration: none;
    }
    .owner-link:hover { color: #64748b; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">✂️</div>
    <h5 class="text-center fw-bold mb-1" style="color:#1a1a2e;">Portal Capster</h5>
    <p class="text-center text-muted mb-4" style="font-size:.83rem;">CrowBarbershop</p>

    {% if error %}
    <div class="alert alert-danger py-2 mb-3" style="font-size:.83rem; border-radius:10px;">
      <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-500 mb-1" style="font-size:.85rem;">Username</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0; border-right:none;">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="username" class="form-control"
                 style="border-radius:0 10px 10px 0; border-left:none;"
                 placeholder="Masukkan username" autofocus required autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-500 mb-1" style="font-size:.85rem;">Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:10px 0 0 10px; border:1.5px solid #e2e8f0; border-right:none;">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" id="pwdInput" class="form-control"
                 style="border-radius:0 0 0 0; border-left:none; border-right:none;"
                 placeholder="Masukkan password" required autocomplete="current-password">
          <button type="button" class="input-group-text btn"
                  style="border-radius:0 10px 10px 0; border:1.5px solid #e2e8f0; border-left:none;"
                  onclick="togglePwd()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="/login" class="owner-link">
        <i class="bi bi-shield-lock me-1"></i>Login sebagai Owner/Admin
      </a>
    </div>
  </div>

  <script>
    function togglePwd() {
      const input = document.getElementById('pwdInput');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
