services:
  - type: web
    name: barber-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 120 run_dashboard:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barber-db
          property: connectionString
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false   # isi manual di Render dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: AUTHORIZED_CAPSTERS
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: barber-db
    databaseName: barbershop
    plan: free
