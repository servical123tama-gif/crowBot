<div class="d-flex flex-column gap-2">
  {% for c in cards %}
  <div class="card stat-card">
    <div class="card-body d-flex align-items-center gap-3 py-3">
      <!-- Avatar -->
      <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold flex-shrink-0"
           style="width:44px;height:44px;font-size:.95rem;
                  background:{{ ['#0f3460','#e94560','#16213e','#533483','#2b9348'][loop.index0 % 5] }};">
        {{ c.Name[0].upper() }}
      </div>

      <!-- Info -->
      <div class="flex-grow-1" style="min-width:0;">
        <div class="fw-600" style="font-size:.93rem;">{{ c.Name }}</div>
        <div class="text-muted" style="font-size:.78rem;">
          {% if c.Phone %}
            <i class="bi bi-phone me-1"></i>{{ c.Phone }}
            &nbsp;·&nbsp;
          {% endif %}
          <i class="bi bi-scissors me-1"></i>{{ c.VisitCount }} kunjungan
        </div>
        {% if c.AddedBy %}
          <div style="font-size:.73rem;color:#94a3b8;margin-top:.1rem;">
            <i class="bi bi-person-badge me-1"></i>Didaftarkan oleh {{ c.AddedBy }}
          </div>
        {% endif %}
      </div>

      <!-- Tombol QR -->
      <button class="btn btn-sm btn-outline-primary flex-shrink-0"
              style="border-radius:8px;"
              onclick="showQR({{ c.id }}, '{{ c.Name|replace("'", "\\'") }}', {{ c.VisitCount }}, '{{ c.Phone }}')">
        <i class="bi bi-qr-code me-1"></i>QR Code
      </button>
    </div>
  </div>
  {% endfor %}
</div>
